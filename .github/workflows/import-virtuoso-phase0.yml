name: Import Virtuoso Phase 0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    if: github.event.head_commit.message == 'Import Virtuoso Phase 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project
        shell: bash
        run: |
          cat > /tmp/virtuoso.b64 <<'PAYLOAD'
[BASE64_PAYLOAD_PLACEHOLDER]
          PAYLOAD
          rm -rf /tmp/virtuoso-src
          mkdir -p /tmp/virtuoso-src
          base64 -d /tmp/virtuoso.b64 > /tmp/virtuoso.zip
          unzip -q /tmp/virtuoso.zip -d /tmp/virtuoso-src
          rsync -a --delete --exclude='.git/' /tmp/virtuoso-src/ ./
          rm -rf .github/workflows/import-virtuoso-phase0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Virtuoso Phase 0' || exit 0
          git push
