name: Patch Audio Voice Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch AudioEngine voice cleanup
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/audio/AudioEngine.ts')
          s = p.read_text()

          marker = '  // --- PLAY NOTE (NOTE ON) ---\n'
          helper = '''  /** Release and disconnect every node owned by a voice.\n   * Includes AudioBufferSourceNode instances so sampled/noise voices cannot leak after release.\n   */\n  private cleanupVoiceNodes(voice: ActiveVoice): void {\n    voice.nodes.oscillators.forEach((source) => {\n      try { source.stop(); } catch { /* already stopped */ }\n      try { source.disconnect(); } catch { /* already disconnected */ }\n    });\n    voice.nodes.noiseSources.forEach((source) => {\n      try { (source as AudioScheduledSourceNode).stop(); } catch { /* already stopped */ }\n      try { source.disconnect(); } catch { /* already disconnected */ }\n    });\n    voice.nodes.gains.forEach((node) => {\n      try { node.disconnect(); } catch { /* ignore */ }\n    });\n    voice.nodes.filters.forEach((node) => {\n      try { node.disconnect(); } catch { /* ignore */ }\n    });\n    try { voice.nodes.mainGain.disconnect(); } catch { /* ignore */ }\n  }\n\n'''

          old_helper_marker = '  private cleanupVoiceNodes(voice: ActiveVoice): void {'
          if old_helper_marker not in s:
              if marker not in s:
                  raise SystemExit('AudioEngine marker not found')
              s = s.replace(marker, helper + marker, 1)

          old1 = '''      voice.nodes.oscillators.forEach((osc) => {\n        try {\n          osc.stop();\n          osc.disconnect();\n        } catch {\n          // ignore\n        }\n      });\n      voice.nodes.gains.forEach((g) => g.disconnect());\n      voice.nodes.filters.forEach((f) => f.disconnect());\n      voice.nodes.mainGain.disconnect();'''
          old2 = '''      voice.nodes.oscillators.forEach((osc) => {\n        try {\n          osc.stop();\n          osc.disconnect();\n        } catch {\n          // ignore already stopped\n        }\n      });\n      voice.nodes.gains.forEach((g) => g.disconnect());\n      voice.nodes.filters.forEach((f) => f.disconnect());\n      voice.nodes.mainGain.disconnect();'''
          s = s.replace(old1, '      this.cleanupVoiceNodes(voice);', 1)
          s = s.replace(old2, '      this.cleanupVoiceNodes(voice);', 1)
          p.write_text(s)

          if s.count('this.cleanupVoiceNodes(voice);') != 2:
              raise SystemExit('Expected two cleanup call sites after patch')

      - name: Verify TypeScript and build
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build

      - name: Commit patch and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-audio-cleanup.yml
          git add src/audio/AudioEngine.ts
          git commit -m 'fix: clean up all audio voice source nodes'
          git push
