name: Import Virtuoso Phase 0

on:
  push:
    paths:
      - 'virtuoso-phase0-stability.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          rm -rf /tmp/virtuoso
          mkdir -p /tmp/virtuoso
          unzip -q virtuoso-phase0-stability.zip -d /tmp/virtuoso
          find /tmp/virtuoso -name .git -type d -prune -exec rm -rf {} +
          rsync -a --exclude='.git/' /tmp/virtuoso/ ./
          rm -f virtuoso-phase0-stability.zip
          rm -f .github/workflows/import-phase0.yml

      - name: Commit imported project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Virtuoso Phase 0 stability build'
          git push
